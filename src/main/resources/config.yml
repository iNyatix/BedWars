lobby:
  # Glowne lobby serwera. Gracz po zwyklym wejsciu na serwer trafia tutaj.
  # Domyslnie i dla turnieju: world, 0 67 0.
  joinLocation:
    world: "world"
    x: 0
    y: 67
    z: 0
    yaw: 0
    pitch: 0

game:
  returnToLobbySeconds: 10
  # Zapamietywane automatycznie przy wyborze mapy; puste = pierwsza kompletna mapa.
  activeArena: ""
  minPlayers: 2
  playersPerTeam: 4
  reconnectSeconds: 180
  countdownSeconds: 20
  respawnSeconds: 5
  respawnProtectionSeconds: 3
  # Tempo generatorow w bazach, razem z ulepszeniami kuzni (1.5 = o 50% szybciej).
  baseGeneratorSpeed: 1.5
  # 0.75 = o 25% mniej HP z regeneracji w tym samym czasie; nie dotyczy instant heal.
  regenerationMultiplier: 0.75
  combatTagSeconds: 15
  baseRadius: 16
  buildHeight: 120
  voidY: 0
  friendlyFire: false
  autoJoin: false
  # Turniej szkolny: domyslnie NIE startuj automatycznie po kilku pierwszych osobach.
  # true = odliczanie ruszy dopiero, gdy wszystkie sloty (4 x playersPerTeam) beda zajete.
  autoStartWhenFull: false
  # Kwadratowa strefa bez budowania wokol generatorow diamentow/szmaragdow. 3 = 3x3.
  generatorProtectionSize: 3
  allowAdminBuild: true
  timers:
    diamond2: 360
    emerald2: 720
    diamond3: 1080
    emerald3: 1440
    bedsGone: 1800
    suddenDeath: 2400
    # Pelne zamkniecie bordera (1x1), NIE koniec meczu/remis.
    # Od suddenDeath border kurczy sie wokol skonfigurowanego srodka mapy.
    # Po zamknieciu rosnace obrazenia wymuszaja zwyciestwo ostatniej druzyny.
    end: 3000
scoreboard:
  enabled: true
  healthEnabled: true
  dateFormat: dd/MM/yy
  serverLine: "Elektronik"
logging:
  matches: true
messages:
  victoryTitle: "ZWYCIESTWO!"

# Animowane title, dzwieki odliczania i fajerwerki przez 10 s po wygranej.
# Brakujace opcje w starym config.yml sa uzupelniane automatycznie.
effects:
  titles: true
  victoryFireworks: true
  sounds: true
  bedBreakDragonSound: true
  finalKillLightning: true


# TNT jump i fireball jump. Zmieniaj ostroznie - wartosci sa dobrane pod PvP 1.8.8.
jumps:
  tnt:
    enabled: true
    radius: 5
    horizontal: 1.15
    vertical: 0.90
    maxHorizontal: 1.90
  fireball:
    enabled: true
    radius: 4.5
    horizontal: 1.45
    vertical: 0.75
    maxHorizontal: 2.20

# Automatyczne komunikaty wysylane cyklicznie do wszystkich graczy.
# Dodawaj kolejne jako messages.5, messages.6 itd. /bw przeladuj odswieza je bez restartu.
announcements:
  enabled: true
  intervalSeconds: 180
  prefix: "&6&lELEKTRONIK &8» &f"
  messages:
    1: "Organizatorem turnieju jest &eSamorzad Uczniowski Elektronika&f."
    2: "Serwer zostal stworzony przez &eMateusza Nowosielskiego &fwe wspolpracy z &eSamorzadem Uczniowskim&f."
    3: "Powodzenia wszystkim uczestnikom turnieju BedWars!"
    4: "W razie problemow technicznych zglos sie do organizatorow turnieju."

