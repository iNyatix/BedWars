# Dodatkowe ustawienia rozgrywki. Czasy sa w sekundach, chyba ze nazwa zawiera Ticks.
# Tierowe generatory: lista od poziomu 0 (baza) albo od poziomu I (neutralne).
# damage = punkty HP; 2 HP = 1 serce. W naglej smierci maximumDamage ma minimum 20 HP.
# Animacje odswiezaja sie co 4 ticki. Powtarzalne title trwaja do zmiany stanu gry.
